# Tiny helper project for capture.sh: an empty host app plus a UI test that
# rotates the simulated iPad (simctl has no orientation command). Generated
# with `xcodegen generate`; the .xcodeproj is a build artefact (gitignored).
name: ShotsDriver
options:
  bundleIdPrefix: app.dusk-player.shots
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
targets:
  ShotsHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ShotsDriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ShotsHost
    settings:
      base:
        TEST_TARGET_NAME: ShotsHost
